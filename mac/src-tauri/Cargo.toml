[package]
name = "kith-mac"
version = "0.4.1"
description = "Kith for the Mac: a thin window around your own Kith server"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDate", "NSString", "NSArray", "NSCalendar", "NSError", "NSURL", "NSObject", "NSPredicate", "NSCalendar", "NSDate", "block2"] }
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKReminder", "EKTypes", "EKSource"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument"] }

# Pip's on-device voice (voice.rs, kokoro.rs), on Apple silicon only: ONNX Runtime to run the
# Kokoro model, and Kokoro's own English phonemiser (misaki) without its espeak-ng fallback. There
# are no prebuilt ONNX Runtime libraries for Intel Macs any more; Intel Macs use the home voice.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
misaki-rs = { version = "0.11", default-features = false }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-24"] }
