# Kith: the app, its offline desk, and local voice (speech-to-text and Piper).
#   cp .env.example .env   # then fill it in (see docs/setup.md)
#   docker compose up -d --build
#   docker compose --profile voice up -d --build   # also start local whisper + piper
#
# Memory limits come from .env (KITH_MEM_*), so moving between a small machine ("light") and a
# bigger one ("full") is just a change of settings. Defaults are the light profile; see docs/setup.md.
name: kith

services:
  kith:
    build: { context: ., target: kith }
    image: kith:local
    env_file: .env
    environment:
      KITH_DESK_URL: http://desk:8790
      KITH_STT_HOST: ${KITH_STT_HOST:-whisper}
      KITH_TTS_HOST: ${KITH_TTS_HOST:-piper}
      # Keep Node's heap inside the container's memory limit.
      NODE_OPTIONS: --max-old-space-size=${KITH_NODE_HEAP_MB:-384}
    mem_limit: ${KITH_MEM_APP:-512m}
    ports:
      - "${KITH_BIND:-127.0.0.1}:${KITH_PORT:-8787}:8787"
    volumes:
      - kith-data:/data
    networks: [default, deskland]
    depends_on:
      desk: { condition: service_healthy }
      egress: { condition: service_healthy }
    # A small init (tini) passes Docker's stop signal on, so Kith can finish what it's doing.
    init: true
    stop_grace_period: 15s
    # Healthy when the database answers and the scheduler has ticked in the last 20 minutes.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/public/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # The companion's desk: no internet (internal network), no API key, read-only filesystem.
  # Its browser can only get out through the egress proxy, which applies the family's block list.
  desk:
    build: { context: ., target: desk }
    image: kith-desk:local
    environment:
      KITH_DESK_TOKEN: ${KITH_DESK_TOKEN:?set KITH_DESK_TOKEN in .env}
      DESK_EGRESS_PROXY: http://egress:3128
      HOME: /tmp/home
      DESK_MAX_GB: ${KITH_DESK_MAX_GB:-5}
      DESK_BROWSER_IDLE_MINUTES: ${KITH_DESK_BROWSER_IDLE_MINUTES:-2}
    volumes:
      - desk-data:/desk
    networks: [deskland]
    read_only: true
    tmpfs: [/tmp]
    shm_size: ${KITH_DESK_SHM:-256m}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KITH_MEM_DESK:-768m}
    pids_limit: 256
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # The desk browser's only way to the internet: HTTPS to public hosts that aren't blocked; never private addresses.
  egress:
    build: { context: ., target: egress }
    image: kith-egress:local
    environment:
      KITH_DESK_TOKEN: ${KITH_DESK_TOKEN:?set KITH_DESK_TOKEN in .env}
      KITH_INTERNAL_URL: http://kith:8787
    networks: [default, deskland]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KITH_MEM_EGRESS:-128m}
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3128/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Local speech-to-text (Wyoming protocol). Audio is processed in memory and never stored.
  whisper:
    image: rhasspy/wyoming-whisper:latest
    command: ["--model", "${KITH_WHISPER_MODEL:-tiny-int8}", "--language", "${KITH_STT_LANGUAGE:-en}"]
    volumes:
      - whisper-data:/data
    networks: [default]
    profiles: [voice]
    mem_limit: ${KITH_MEM_WHISPER:-1536m}
    restart: unless-stopped

  # Local text-to-speech. If you already run Piper elsewhere, skip this and set KITH_TTS_HOST.
  piper:
    image: rhasspy/wyoming-piper:latest
    command: ["--voice", "${KITH_PIPER_DEFAULT_VOICE:-en_GB-cori-medium}"]
    volumes:
      - piper-data:/data
    networks: [default]
    profiles: [voice]
    mem_limit: ${KITH_MEM_PIPER:-512m}
    restart: unless-stopped

networks:
  deskland:
    internal: true

volumes:
  kith-data:
  desk-data:
  whisper-data:
  piper-data:
